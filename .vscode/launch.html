  <main>
    <section class="preguntas-1">

    <form id="formulario-preguntas">

      <div id="contenedor-preguntas">
        <!-- Las preguntas se generan aquí automáticamente con JS -->

  <script>

    const preguntas = [
      { texto: "¿Cuántos libros tiene la Biblia?", respuesta: "66" },
      { texto: "¿En cuántos años se escribió la Biblia?", respuesta: "1600" },
      { texto: "¿En cuántos idiomas se escribió?", respuesta: "3" },
      { texto: "¿Qué es el Pentateuco?", respuesta: "los primeros 5 libros de la Biblia" },
      { texto: "¿Quién escribió los primeros 5 libros?", respuesta: "Moisés" }
    ];

    let inicio;
    let intervalo;
    const elementocantico = document.getElementById("cantico");

    document.addEventListener('DOMContentLoaded', () => {
      generarPreguntas();
      tiempolimite();
    });

    function generarPreguntas() {
      const contenedor = document.getElementById("contenedor-preguntas");
      let html = "";

      preguntas.forEach((pregunta, index) => {
        html += `
          <article class="pregunta">
            <h3>Pregunta ${index + 1}</h3>
            <p>${pregunta.texto}</p>
            <input type="text" id="respuesta-${index + 1}">
          </article>
        `;
      });
  contenedor.innerHTML = html;
    }
