


<script>
const buscarSegundoMasGrande = (numeros) => {
    // 1. Eliminamos duplicados convirtiendo el array a Set y de vuelta a Array
    const duplicados = [...new Set(numeros)];
    
    // 2. Si no hay al menos dos números únicos, no se puede determinar el segundo más grande
    if (duplicados.length < 2) return null; 
    
    // 3. Ordenamos de mayor a menor y tomamos el segundo elemento (índice 1)
    return duplicados.toSorted((a, b) => b - a)[1];



};


console.log(buscarSegundoMasGrande([1, 4, 4, 2, 2])); // Debería imprimir 2


</script>
